name: PR Deploy

on:
  pull_request:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
      # Setup Java environment in order to build the Android app.
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: '12.x'

      # Setup the flutter environment.
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup firebase_options.dart file
        run: echo "$FIREBASE_OPTIONS_DART"  | base64 --decode > lib/firebase_options.dart
        shell: bash
        env:
          FIREBASE_OPTIONS_DART: ${{secrets.FIREBASE_OPTIONS_DART}}

      - name: Setup .env file
        run: echo "$DOT_ENV"  | base64 --decode > .env
        shell: bash
        env:
          DOT_ENV: ${{secrets.DOT_ENV}}

      # Get flutter dependencies.
      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build web

      # Run a build step here if your project requires
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: << cloudflare account id >>
          projectName: << cloudflare project name >>
          directory: build/web
          # use the pull request branch name as the subdomain
          branch: ${{ github.ref_name }}
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Optional: Change the Wrangler version, allows you to point to a specific version or a tag such as `beta`
          wranglerVersion: '3'
